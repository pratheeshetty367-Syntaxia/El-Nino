# Starts only the PostgreSQL database used by the backend.
services:
  db:
    image: postgres:16
    container_name: elnino-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: elnino
    ports:
      - "5433:5432"
    volumes:
      - elnino_pgdata:/var/lib/postgresql/data
 
volumes:
  elnino_pgdata:
